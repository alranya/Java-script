<body>
    </h3>1.<h3>
        <script>
            let num=123, reverse=0
            for(;num>0;)
        {
            r=num%10
            reverse= (reverse*10) +r
            num = Math.floor(num/10)
        }
        document.write(reverse)
        </script>

    <h3>2.</h3>
 <script>
             num=123
              reverse=0
              n=num
            for(;num>0;)
        {
            r=num%10
            reverse= (reverse*10) +r
            num = Math.floor(num/10)
        }
        
        if(n==reverse)
        {
            document.write("palindrome")
        }
        else
        {
            document.write("not palindrome")
        }
        </script>
    
</body>
