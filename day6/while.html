<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>1.natural numbers</h3>
    <script>
        i=1
        while(i<=10)
    {
        document.write("<br>",i)
        i++
    }
    </script>
    <h3>2.even numbers</h3>
    <script>
          i=2
        while(i<=20)
    {
        document.write("&nbsp;",i)
        i=i+2
    }
    </script>
    <h3>3.odd numbers</h3>
    <script>
        i=1
        while(i<=15)
    {
        document.write("&nbsp;",i)
        i=i+2
    }
    </script>
</body>
</html>
